# Dev: `docker compose up -d` starts ONLY postgres (api/webapp are behind the
# "app" profile — dev runs those via `./cm ui`). Prod: COMPOSE_PROFILES=app
# (or `docker compose --profile app up -d --build`) runs the full stack; the
# pipeline is cron-driven via `docker compose exec -T api ./cm ...`
# (see deploy/crontab.prod + deploy/README-prod.md).
#
# Schema is owned by the one-shot `migrate` service: it runs `./cm migrate` to
# completion and exits, and `api` won't start until it succeeds
# (service_completed_successfully). Re-runs on every `up` are safe — the runner
# skips already-applied versions and aborts on a dirty (half-applied) one.
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: nubra-community-postgres
    environment:
      POSTGRES_USER: community
      POSTGRES_PASSWORD: community
      POSTGRES_DB: nubra_community
    ports:
      - "5544:5432"
    volumes:
      - nubra_community_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U community -d nubra_community"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot schema owner: applies pending migrations then exits 0. Shares the
  # api image (same ./cm + migrations/), so no separate build/pull. api gates on
  # this completing successfully; a DIRTY/failed migration exits non-zero and
  # keeps api from starting against a bad schema.
  migrate:
    image: ${ECR_REGISTRY:-851725268918.dkr.ecr.ap-south-1.amazonaws.com}/zs/nubra-ai:nubra-beacon-api-${RELEASE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.api
    profiles: ["app"]
    env_file: .env
    environment:
      # container-internal DB host, independent of the .env flavor (dev/prod)
      DB_URL: postgresql://community:community@postgres:5432/nubra_community
      TZ: Asia/Kolkata
    command: ["./cm", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"   # one-shot job, not a long-running server

  api:
    # RELEASE_TAG comes from .env (compose substitution) — `make pull-prod`
    # pulls this tag from ECR; `up --build` still builds locally as fallback.
    image: ${ECR_REGISTRY:-851725268918.dkr.ecr.ap-south-1.amazonaws.com}/zs/nubra-ai:nubra-beacon-api-${RELEASE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.api
    profiles: ["app"]
    env_file: .env
    # explicit upstream resolvers: the prod box's DNS chain returns AAAA-only
    # answers for Instagram CDN hosts (no A records → Errno 101/-9, live
    # 2026-08-13) while the box has no IPv6 route. Docker's embedded DNS still
    # resolves compose service names (postgres) before forwarding upstream.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      # inside the compose network the DB lives at the service name, not localhost
      DB_URL: postgresql://community:community@postgres:5432/nubra_community
      MODE: prod
      TZ: Asia/Kolkata
    ports:
      - "8400:8400"
    volumes:
      - ./out:/app/out          # cron logs + message archives visible on the host
      - hf_cache:/hf-cache      # embedding model cache survives restarts
      # registry is CONFIG, not code: bind-mount so prod edits (thresholds,
      # dashboard_url, weight re-tunes) apply on the next run without an
      # image release. Read-only — the pipeline never writes it.
      - ./community/config/registry.yaml:/app/community/config/registry.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8400/api/v1/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  webapp:
    image: ${ECR_REGISTRY:-851725268918.dkr.ecr.ap-south-1.amazonaws.com}/zs/nubra-ai:nubra-beacon-webapp-${RELEASE_TAG:-latest}
    build:
      context: ./webapp
      args:
        NEXT_PUBLIC_API_BASE: http://api:8400/api/v1   # browser-proxy rewrite target (build-time)
    profiles: ["app"]
    environment:
      API_BASE: http://api:8400/api/v1                 # server-side fetches (runtime)
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e",
             "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── SSO front door — ON HOLD (2026-08-19, user decision) ─────────────────
  # Behind its OWN profile ("sso", not "app") so no release or `--profile app
  # up` can start it accidentally. Ships when the Slack-approval flow is built
  # (design: docs/sso-runbook-2026-08-19.md). Start explicitly with:
  #   docker compose --profile sso up -d oauth2-proxy
  # The beacon API (:8101, key-authed) will NOT be behind this — machines keep keys.
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    profiles: ["sso"]
    environment:
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:-}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:-}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:-}
      OAUTH2_PROXY_REDIRECT_URL: ${BEACON_SSO_REDIRECT_URL:-https://nubra-beacon.zanskar.xyz/oauth2/callback}
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: http://webapp:3000
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"          # the allowlist FILE governs, not domains
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: /etc/oauth2/allowlist.txt
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_EXPIRE: 168h
      OAUTH2_PROXY_REVERSE_PROXY: "true"       # TLS terminates at the company front
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"    # forwards X-Auth-Request-Email → action attribution
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_BANNER: "Nubra Beacon — sign in with your work Google account."
      OAUTH2_PROXY_FOOTER: "No access yet? Post your email in the Beacon Slack group; an admin approves and you are in within a minute."
    ports:
      - "4180:4180"
    volumes:
      - ./deploy/beacon-allowlist.txt:/etc/oauth2/allowlist.txt:ro
    depends_on:
      - webapp
    restart: unless-stopped

volumes:
  nubra_community_pgdata:
  hf_cache:
